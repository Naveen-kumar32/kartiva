# Kartiva — Nginx reverse proxy (template; finalised and tested in Phase 9, see docs/DEPLOYMENT_GUIDE.md).
# Replace kartiva.in with the real domain. Certificates: certbot --nginx -d kartiva.in -d www.kartiva.in

# ---- Rate limiting (brute force / abuse). Django (DRF throttles) limits per user on top of this. ----
limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;   # login, register, password reset
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;   # general API
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Correlation id: keep the client's X-Request-ID (axios sends one) or create one; logged + passed to Django.
map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

log_format kartiva_json escape=json '{"time":"$time_iso8601","req_id":"$req_id","ip":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","ua":"$http_user_agent"}';

upstream kartiva_app {
  server unix:/run/gunicorn.sock fail_timeout=0;
  keepalive 16;
}

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name kartiva.in www.kartiva.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://kartiva.in$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name kartiva.in www.kartiva.in;

  ssl_certificate     /etc/letsencrypt/live/kartiva.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kartiva.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  access_log /var/log/nginx/kartiva.access.log kartiva_json;
  error_log  /var/log/nginx/kartiva.error.log warn;

  # ---- Security headers (CSP, clickjacking, MIME sniffing, referrer, permissions, HSTS) ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://cdn.dummyjson.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  server_tokens off;

  # ---- Limits & timeouts ----
  client_max_body_size 6m;          # product images / KYC docs (Django validates type + size again)
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  limit_conn perip 50;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Never serve hidden / backup files (path traversal, leaked .env or .git)
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(bak|sql|dump|env|ini|log|py|sh)$ { deny all; }

  # ---- API (Django via Gunicorn) ----
  location ~ ^/api/v1/auth/(login|register|password-reset) {
    limit_req zone=auth burst=5 nodelay;
    include /etc/kartiva/nginx-proxy.conf;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/kartiva/nginx-proxy.conf;
  }
  location = /api/v1/health/ {
    access_log off;
    include /etc/kartiva/nginx-proxy.conf;
  }
  # Razorpay webhooks: no rate limit (signature verified in Django), small bodies only
  location = /api/v1/payments/webhook/ {
    client_max_body_size 256k;
    include /etc/kartiva/nginx-proxy.conf;
  }
  # Django admin on a secret path, staff only (also IP-allowlist it if the office has a fixed IP)
  location /__kartiva-staff__/ {
    include /etc/kartiva/nginx-proxy.conf;
  }
  location /static/ {
    alias /var/www/kartiva/backend/staticfiles/;
    expires 30d;
    add_header Cache-Control "public";
  }

  # ---- SPA (built frontend) ----
  root /var/www/kartiva/frontend/dist;
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";    # hashed file names → safe to cache forever (CDN friendly)
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";              # index.html always revalidated so deploys show up
    try_files $uri $uri/ /index.html;
  }
}
