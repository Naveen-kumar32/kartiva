# Render Blueprint — https://render.com/docs/blueprint-spec
# Frontend (static site) + Django API (web service) + Neon PostgreSQL (DATABASE_URL, set in the Render dashboard).
# The frontend proxies /api/* to the backend, so the browser sees one site (the sign-in cookie keeps working).
services:
  - type: web
    name: kartiva-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_DATA_MODE
        value: api             # "mock" = sample data in the browser, no backend
      - key: VITE_API_URL
        value: /api/v1
      - key: NODE_VERSION
        value: "22"
    routes:
      # API calls go to the Django backend (must come before the SPA rule)
      - type: rewrite
        source: /api/*
        destination: https://kartiva-backend.onrender.com/api/*
      # Single-page app: every path is served by index.html (React Router handles it)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ---- Django API ----
  - type: web
    name: kartiva-backend
    runtime: python
    plan: free
    region: singapore             # same region as the Neon database
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --graceful-timeout 25
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.13"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL           # Neon connection string (pooled) — paste it in the Render dashboard
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: kartiva-backend.onrender.com,kartiva-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kartiva-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://kartiva-frontend.onrender.com
